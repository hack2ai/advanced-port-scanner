name: Build and publish Python package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (requires a configured trusted publisher)"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag to build and publish (for example v0.3.5)"
        required: true
        default: v0.3.5
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${RELEASE_REF}"
          if [[ "$ref" != v* ]]; then
            echo "Release ref must be a version tag such as v0.3.5; got: $ref" >&2
            exit 1
          fi

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging

      - name: Build distributions
        run: python -m build

      - name: Verify distribution contents and version
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_REF#v}"
          actual=$(python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          from email.parser import Parser

          versions = set()
          required_files = {"web/templates/index.html"}

          for wheel in Path("dist").glob("*.whl"):
              with zipfile.ZipFile(wheel) as zf:
                  names = set(zf.namelist())
                  missing = [item for item in required_files if item not in names]
                  if missing:
                      raise SystemExit(
                          f"Wheel is missing required dashboard files: {missing}"
                      )
                  metadata_name = next(
                      name for name in zf.namelist()
                      if name.endswith(".dist-info/METADATA")
                  )
                  metadata = Parser().parsestr(
                      zf.read(metadata_name).decode("utf-8")
                  )
                  versions.add(metadata["Version"])

          for sdist in Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist, "r:gz") as tf:
                  names = {member.name for member in tf.getmembers()}
                  missing = [
                      item for item in required_files
                      if not any(name.endswith(item) for name in names)
                  ]
                  if missing:
                      raise SystemExit(
                          f"Source distribution is missing required dashboard files: {missing}"
                      )
                  metadata_member = next(
                      member for member in tf.getmembers()
                      if member.name.endswith("/PKG-INFO")
                  )
                  stream = tf.extractfile(metadata_member)
                  if stream is None:
                      raise SystemExit("Could not read PKG-INFO from sdist")
                  metadata = Parser().parsestr(stream.read().decode("utf-8"))
                  versions.add(metadata["Version"])

          if len(versions) != 1:
              raise SystemExit(
                  f"Expected exactly one distribution version, found: {sorted(versions)}"
              )
          print(next(iter(versions)))
          PY
          )
          echo "Requested tag version: $expected"
          echo "Built distribution version: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "Distribution version does not match release tag" >&2
            exit 1
          fi

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    if: >-
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/v') &&
       vars.PYPI_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish == true &&
       startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/advanced-port-scanner
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
