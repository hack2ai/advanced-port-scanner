name: Build and publish Python package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (requires a configured trusted publisher)"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag to build and publish (for example v0.3.1)"
        required: true
        default: v0.3.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${RELEASE_REF}"
          if [[ "$ref" != v* ]]; then
            echo "Release ref must be a version tag such as v0.3.1; got: $ref" >&2
            exit 1
          fi

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    if: >-
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/v') &&
       vars.PYPI_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish == true &&
       startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/advanced-port-scanner
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
