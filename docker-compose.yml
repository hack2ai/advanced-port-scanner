services:
  port-scanner:
    build: .
    container_name: advanced-port-scanner
    ports:
      - "5000:5000"
    volumes:
      - scanner_data:/app/data
      - scanner_reports:/app/reports
      - scanner_logs:/app/logs
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      MAX_CONCURRENT_JOBS: 2
      MAX_TARGETS: 16
      MAX_PORTS: 4096
      HISTORY_RETENTION: 100
      REPORT_RETENTION: 100
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Enable only in an isolated lab if SYN mode is explicitly required:
    # cap_add:
    #   - NET_RAW

volumes:
  scanner_data:
  scanner_reports:
  scanner_logs:
